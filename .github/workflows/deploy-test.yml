name: Deploy Test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy to the test VPS environment
        required: true
        default: main
      mode:
        description: Deploy the ref or find the ChallengeFlows registry
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - find_flow_registry
          - configure_flow_registry
      registry_id:
        description: Google Spreadsheet ID used only by configure_flow_registry
        required: false
        default: ""

concurrency:
  group: test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
    env:
      TEST_VPS_HOST: ${{ secrets.TEST_VPS_HOST }}
      TEST_VPS_PORT: ${{ secrets.TEST_VPS_PORT }}
      TEST_VPS_USER: ${{ secrets.TEST_VPS_USER }}
      TEST_VPS_SSH_KEY: ${{ secrets.TEST_VPS_SSH_KEY }}
      TEST_VPS_APP_DIR: ${{ secrets.TEST_VPS_APP_DIR }}
      TEST_VPS_SERVICE_NAME: ${{ secrets.TEST_VPS_SERVICE_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Resolve checked-out release SHA
        run: echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Verify test suite before deploy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
      - name: Validate test deployment secrets
        run: |
          test -n "$TEST_VPS_HOST"
          test -n "$TEST_VPS_USER"
          test -n "$TEST_VPS_SSH_KEY"
          test -n "$TEST_VPS_APP_DIR"
          test -n "$TEST_VPS_SERVICE_NAME"
          test "$TEST_VPS_APP_DIR" = "/opt/telegram_goals_bot_test"
          test "$TEST_VPS_SERVICE_NAME" = "telegram-goals-bot-test.service"
      - name: Create deployment archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='data/audio' \
            --exclude='data/sqlite' \
            --exclude='reports/pdf' \
            --exclude='backups' \
            --exclude='logs' \
            --exclude='*.sqlite' \
            --exclude='*.sqlite3' \
            --exclude='*.db' \
            -czf "/tmp/telegram-goals-bot-test-${DEPLOY_SHA}.tgz" .
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$TEST_VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${TEST_VPS_PORT:-22}" "$TEST_VPS_HOST" >> ~/.ssh/known_hosts
      - name: Upload archive
        run: |
          scp -i ~/.ssh/deploy_key -P "${TEST_VPS_PORT:-22}" \
            "/tmp/telegram-goals-bot-test-${DEPLOY_SHA}.tgz" \
            "$TEST_VPS_USER@$TEST_VPS_HOST:/tmp/telegram-goals-bot-test-${DEPLOY_SHA}.tgz"
      - name: Install test release and restart test service
        run: |
          ssh -i ~/.ssh/deploy_key -p "${TEST_VPS_PORT:-22}" "$TEST_VPS_USER@$TEST_VPS_HOST" \
            "TEST_APP_DIR='$TEST_VPS_APP_DIR' TEST_SERVICE_NAME='$TEST_VPS_SERVICE_NAME' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          test "$TEST_APP_DIR" = "/opt/telegram_goals_bot_test"
          test "$TEST_SERVICE_NAME" = "telegram-goals-bot-test.service"

          TEST_SERVICE_USER="telegram-goals-bot-test"
          TEST_SERVICE_GROUP="telegram-goals-bot-test"
          RELEASE_DIR="$TEST_APP_DIR/releases/$DEPLOY_SHA"
          mkdir -p "$RELEASE_DIR" "$TEST_APP_DIR/shared"
          tar -xzf "/tmp/telegram-goals-bot-test-$DEPLOY_SHA.tgz" -C "$RELEASE_DIR"

          cd "$RELEASE_DIR"
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest

          install -d -m 700 \
            "$TEST_APP_DIR/shared/data/audio" \
            "$TEST_APP_DIR/shared/data/sqlite" \
            "$TEST_APP_DIR/shared/reports/pdf" \
            "$TEST_APP_DIR/shared/logs" \
            "$TEST_APP_DIR/shared/backups/sqlite" \
            "$TEST_APP_DIR/shared/backups/google_sheets_exports" \
            "$TEST_APP_DIR/shared/backups/pdf"

          ./.venv/bin/telegram-goals-bot --env-file "$TEST_APP_DIR/shared/.env" check-config

          ln -sfn "$RELEASE_DIR" "$TEST_APP_DIR/current"
          if ! getent group "$TEST_SERVICE_GROUP" >/dev/null 2>&1; then
            sudo groupadd --system "$TEST_SERVICE_GROUP"
          fi
          if ! id -u "$TEST_SERVICE_USER" >/dev/null 2>&1; then
            sudo useradd --system --gid "$TEST_SERVICE_GROUP" --home-dir "$TEST_APP_DIR" --shell /usr/sbin/nologin "$TEST_SERVICE_USER"
          fi
          sudo chown -R "$TEST_SERVICE_USER:$TEST_SERVICE_GROUP" "$TEST_APP_DIR/shared"
          sudo install -m 644 deploy/systemd/telegram-goals-bot-test.service "/etc/systemd/system/$TEST_SERVICE_NAME"
          sudo systemctl daemon-reload
          sudo systemctl restart "$TEST_SERVICE_NAME"
          sudo systemctl status "$TEST_SERVICE_NAME" --no-pager
          REMOTE

  find-flow-registry:
    if: inputs.mode == 'find_flow_registry'
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
    env:
      TEST_VPS_HOST: ${{ secrets.TEST_VPS_HOST }}
      TEST_VPS_PORT: ${{ secrets.TEST_VPS_PORT }}
      TEST_VPS_USER: ${{ secrets.TEST_VPS_USER }}
      TEST_VPS_SSH_KEY: ${{ secrets.TEST_VPS_SSH_KEY }}
      TEST_VPS_APP_DIR: ${{ secrets.TEST_VPS_APP_DIR }}
    steps:
      - name: Configure SSH
        run: |
          test "$TEST_VPS_APP_DIR" = "/opt/telegram_goals_bot_test"
          install -m 700 -d ~/.ssh
          printf '%s' "$TEST_VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${TEST_VPS_PORT:-22}" "$TEST_VPS_HOST" >> ~/.ssh/known_hosts
      - name: Find spreadsheet containing ChallengeFlows
        run: |
          ssh -i ~/.ssh/deploy_key -p "${TEST_VPS_PORT:-22}" "$TEST_VPS_USER@$TEST_VPS_HOST" \
            "TEST_APP_DIR='$TEST_VPS_APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          set -a
          . "$TEST_APP_DIR/shared/.env"
          set +a
          "$TEST_APP_DIR/current/.venv/bin/python" - <<'PY'
          import os
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build

          credentials = Credentials.from_service_account_file(
              os.environ["GOOGLE_APPLICATION_CREDENTIALS"],
              scopes=("https://www.googleapis.com/auth/drive.metadata.readonly", "https://www.googleapis.com/auth/spreadsheets.readonly"),
          )
          drive = build("drive", "v3", credentials=credentials, cache_discovery=False)
          sheets = build("sheets", "v4", credentials=credentials, cache_discovery=False)
          token = None
          matches = []
          while True:
              response = drive.files().list(
                  q="mimeType='application/vnd.google-apps.spreadsheet' and trashed=false",
                  fields="nextPageToken,files(id,name)", pageSize=100, pageToken=token,
              ).execute()
              for item in response.get("files", []):
                  try:
                      metadata = sheets.spreadsheets().get(
                          spreadsheetId=item["id"], fields="sheets.properties.title"
                      ).execute()
                  except Exception:
                      continue
                  titles = {sheet.get("properties", {}).get("title") for sheet in metadata.get("sheets", [])}
                  if "ChallengeFlows" in titles:
                      matches.append((item["id"], item["name"]))
              token = response.get("nextPageToken")
              if not token:
                  break
          if not matches:
              raise SystemExit("FLOW_REGISTRY_NOT_FOUND")
          for spreadsheet_id, name in matches:
              print(f"FLOW_REGISTRY_FOUND id={spreadsheet_id} name={name}")
          PY
          REMOTE

  configure-flow-registry:
    if: inputs.mode == 'configure_flow_registry'
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
    env:
      TEST_VPS_HOST: ${{ secrets.TEST_VPS_HOST }}
      TEST_VPS_PORT: ${{ secrets.TEST_VPS_PORT }}
      TEST_VPS_USER: ${{ secrets.TEST_VPS_USER }}
      TEST_VPS_SSH_KEY: ${{ secrets.TEST_VPS_SSH_KEY }}
      TEST_VPS_APP_DIR: ${{ secrets.TEST_VPS_APP_DIR }}
      REGISTRY_ID: ${{ inputs.registry_id }}
    steps:
      - name: Configure SSH
        run: |
          test "$TEST_VPS_APP_DIR" = "/opt/telegram_goals_bot_test"
          test -n "$REGISTRY_ID"
          install -m 700 -d ~/.ssh
          printf '%s' "$TEST_VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${TEST_VPS_PORT:-22}" "$TEST_VPS_HOST" >> ~/.ssh/known_hosts
      - name: Configure flow registry and report service identity
        run: |
          ssh -i ~/.ssh/deploy_key -p "${TEST_VPS_PORT:-22}" "$TEST_VPS_USER@$TEST_VPS_HOST" \
            "TEST_APP_DIR='$TEST_VPS_APP_DIR' REGISTRY_ID='$REGISTRY_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          set -a
          . "$TEST_APP_DIR/shared/.env"
          set +a
          "$TEST_APP_DIR/current/.venv/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          env_path = Path(os.environ["TEST_APP_DIR"]) / "shared" / ".env"
          key = "CHALLENGE_FLOWS_SHEETS_ID"
          lines = env_path.read_text(encoding="utf-8").splitlines()
          replacement = f"{key}={os.environ['REGISTRY_ID']}"
          updated = [replacement if line.startswith(f"{key}=") else line for line in lines]
          if not any(line.startswith(f"{key}=") for line in lines):
              updated.append(replacement)
          env_path.write_text("\n".join(updated) + "\n", encoding="utf-8")
          credential_path = Path(os.environ["GOOGLE_APPLICATION_CREDENTIALS"])
          client_email = json.loads(credential_path.read_text(encoding="utf-8"))["client_email"]
          print(f"SERVICE_ACCOUNT_EMAIL={client_email}")
          PY
          REMOTE
