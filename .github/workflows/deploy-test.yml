name: Deploy Test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy to the test VPS environment
        required: true
        default: main
      mode:
        description: Deploy or run a safe test-environment spreadsheet diagnostic
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - find_flow_registry
          - inspect_business_sheet
          - migrate_business_schema
          - create_smoke_flow_sheet
          - configure_flow_registry
      registry_id:
        description: Google Spreadsheet ID used only by configure_flow_registry
        required: false
        default: ""

concurrency:
  group: test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
    env:
      TEST_VPS_HOST: ${{ secrets.TEST_VPS_HOST }}
      TEST_VPS_PORT: ${{ secrets.TEST_VPS_PORT }}
      TEST_VPS_USER: ${{ secrets.TEST_VPS_USER }}
      TEST_VPS_SSH_KEY: ${{ secrets.TEST_VPS_SSH_KEY }}
      TEST_VPS_APP_DIR: ${{ secrets.TEST_VPS_APP_DIR }}
      TEST_VPS_SERVICE_NAME: ${{ secrets.TEST_VPS_SERVICE_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Resolve checked-out release SHA
        run: echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Verify test suite before deploy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
      - name: Validate test deployment secrets
        run: |
          test -n "$TEST_VPS_HOST"
          test -n "$TEST_VPS_USER"
          test -n "$TEST_VPS_SSH_KEY"
          test -n "$TEST_VPS_APP_DIR"
          test -n "$TEST_VPS_SERVICE_NAME"
          test "$TEST_VPS_APP_DIR" = "/opt/telegram_goals_bot_test"
          test "$TEST_VPS_SERVICE_NAME" = "telegram-goals-bot-test.service"
      - name: Create deployment archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='data/audio' \
            --exclude='data/sqlite' \
            --exclude='reports/pdf' \
            --exclude='backups' \
            --exclude='logs' \
            --exclude='*.sqlite' \
            --exclude='*.sqlite3' \
            --exclude='*.db' \
            -czf "/tmp/telegram-goals-bot-test-${DEPLOY_SHA}.tgz" .
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$TEST_VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${TEST_VPS_PORT:-22}" "$TEST_VPS_HOST" >> ~/.ssh/known_hosts
      - name: Upload archive
        run: |
          scp -i ~/.ssh/deploy_key -P "${TEST_VPS_PORT:-22}" \
            "/tmp/telegram-goals-bot-test-${DEPLOY_SHA}.tgz" \
            "$TEST_VPS_USER@$TEST_VPS_HOST:/tmp/telegram-goals-bot-test-${DEPLOY_SHA}.tgz"
      - name: Install test release and restart test service
        run: |
          ssh -i ~/.ssh/deploy_key -p "${TEST_VPS_PORT:-22}" "$TEST_VPS_USER@$TEST_VPS_HOST" \
            "TEST_APP_DIR='$TEST_VPS_APP_DIR' TEST_SERVICE_NAME='$TEST_VPS_SERVICE_NAME' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          test "$TEST_APP_DIR" = "/opt/telegram_goals_bot_test"
          test "$TEST_SERVICE_NAME" = "telegram-goals-bot-test.service"

          TEST_SERVICE_USER="telegram-goals-bot-test"
          TEST_SERVICE_GROUP="telegram-goals-bot-test"
          RELEASE_DIR="$TEST_APP_DIR/releases/$DEPLOY_SHA"
          mkdir -p "$RELEASE_DIR" "$TEST_APP_DIR/shared"
          tar -xzf "/tmp/telegram-goals-bot-test-$DEPLOY_SHA.tgz" -C "$RELEASE_DIR"

          cd "$RELEASE_DIR"
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest

          install -d -m 700 \
            "$TEST_APP_DIR/shared/data/audio" \
            "$TEST_APP_DIR/shared/data/sqlite" \
            "$TEST_APP_DIR/shared/reports/pdf" \
            "$TEST_APP_DIR/shared/logs" \
            "$TEST_APP_DIR/shared/backups/sqlite" \
            "$TEST_APP_DIR/shared/backups/google_sheets_exports" \
            "$TEST_APP_DIR/shared/backups/pdf"

          ./.venv/bin/telegram-goals-bot --env-file "$TEST_APP_DIR/shared/.env" check-config

          ln -sfn "$RELEASE_DIR" "$TEST_APP_DIR/current"
          if ! getent group "$TEST_SERVICE_GROUP" >/dev/null 2>&1; then
            sudo groupadd --system "$TEST_SERVICE_GROUP"
          fi
          if ! id -u "$TEST_SERVICE_USER" >/dev/null 2>&1; then
            sudo useradd --system --gid "$TEST_SERVICE_GROUP" --home-dir "$TEST_APP_DIR" --shell /usr/sbin/nologin "$TEST_SERVICE_USER"
          fi
          sudo chown -R "$TEST_SERVICE_USER:$TEST_SERVICE_GROUP" "$TEST_APP_DIR/shared"
          sudo install -m 644 deploy/systemd/telegram-goals-bot-test.service "/etc/systemd/system/$TEST_SERVICE_NAME"
          sudo systemctl daemon-reload
          sudo systemctl restart "$TEST_SERVICE_NAME"
          sudo systemctl status "$TEST_SERVICE_NAME" --no-pager
          REMOTE

  find-flow-registry:
    if: inputs.mode == 'find_flow_registry'
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
    env:
      TEST_VPS_HOST: ${{ secrets.TEST_VPS_HOST }}
      TEST_VPS_PORT: ${{ secrets.TEST_VPS_PORT }}
      TEST_VPS_USER: ${{ secrets.TEST_VPS_USER }}
      TEST_VPS_SSH_KEY: ${{ secrets.TEST_VPS_SSH_KEY }}
      TEST_VPS_APP_DIR: ${{ secrets.TEST_VPS_APP_DIR }}
    steps:
      - name: Configure SSH
        run: |
          test "$TEST_VPS_APP_DIR" = "/opt/telegram_goals_bot_test"
          install -m 700 -d ~/.ssh
          printf '%s' "$TEST_VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${TEST_VPS_PORT:-22}" "$TEST_VPS_HOST" >> ~/.ssh/known_hosts
      - name: Find spreadsheet containing ChallengeFlows
        run: |
          ssh -i ~/.ssh/deploy_key -p "${TEST_VPS_PORT:-22}" "$TEST_VPS_USER@$TEST_VPS_HOST" \
            "TEST_APP_DIR='$TEST_VPS_APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          set -a
          . "$TEST_APP_DIR/shared/.env"
          set +a
          cd "$TEST_APP_DIR/current"
          "$TEST_APP_DIR/current/.venv/bin/python" - <<'PY'
          import os
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build

          credentials = Credentials.from_service_account_file(
              os.environ["GOOGLE_APPLICATION_CREDENTIALS"],
              scopes=("https://www.googleapis.com/auth/drive.metadata.readonly", "https://www.googleapis.com/auth/spreadsheets.readonly"),
          )
          drive = build("drive", "v3", credentials=credentials, cache_discovery=False)
          sheets = build("sheets", "v4", credentials=credentials, cache_discovery=False)
          token = None
          matches = []
          while True:
              response = drive.files().list(
                  q="mimeType='application/vnd.google-apps.spreadsheet' and trashed=false",
                  fields="nextPageToken,files(id,name)", pageSize=100, pageToken=token,
              ).execute()
              for item in response.get("files", []):
                  try:
                      metadata = sheets.spreadsheets().get(
                          spreadsheetId=item["id"], fields="sheets.properties.title"
                      ).execute()
                  except Exception:
                      continue
                  titles = {sheet.get("properties", {}).get("title") for sheet in metadata.get("sheets", [])}
                  if "ChallengeFlows" in titles:
                      matches.append((item["id"], item["name"]))
              token = response.get("nextPageToken")
              if not token:
                  break
          if not matches:
              raise SystemExit("FLOW_REGISTRY_NOT_FOUND")
          for spreadsheet_id, name in matches:
              print(f"FLOW_REGISTRY_FOUND id={spreadsheet_id} name={name}")
          PY
          REMOTE

  inspect-business-sheet:
    if: inputs.mode == 'inspect_business_sheet'
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
    env:
      TEST_VPS_HOST: ${{ secrets.TEST_VPS_HOST }}
      TEST_VPS_PORT: ${{ secrets.TEST_VPS_PORT }}
      TEST_VPS_USER: ${{ secrets.TEST_VPS_USER }}
      TEST_VPS_SSH_KEY: ${{ secrets.TEST_VPS_SSH_KEY }}
      TEST_VPS_APP_DIR: ${{ secrets.TEST_VPS_APP_DIR }}
    steps:
      - name: Configure SSH
        run: |
          test "$TEST_VPS_APP_DIR" = "/opt/telegram_goals_bot_test"
          install -m 700 -d ~/.ssh
          printf '%s' "$TEST_VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${TEST_VPS_PORT:-22}" "$TEST_VPS_HOST" >> ~/.ssh/known_hosts
      - name: Report configured business spreadsheet
        run: |
          ssh -i ~/.ssh/deploy_key -p "${TEST_VPS_PORT:-22}" "$TEST_VPS_USER@$TEST_VPS_HOST" \
            "TEST_APP_DIR='$TEST_VPS_APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          set -a
          . "$TEST_APP_DIR/shared/.env"
          set +a
          cd "$TEST_APP_DIR/current"
          "$TEST_APP_DIR/current/.venv/bin/python" - <<'PY'
          import os
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build

          spreadsheet_id = os.environ["GOOGLE_SHEETS_ID"]
          credentials = Credentials.from_service_account_file(
              os.environ["GOOGLE_APPLICATION_CREDENTIALS"],
              scopes=("https://www.googleapis.com/auth/spreadsheets.readonly",),
          )
          sheets = build("sheets", "v4", credentials=credentials, cache_discovery=False)
          metadata = sheets.spreadsheets().get(
              spreadsheetId=spreadsheet_id,
              fields="properties.title",
          ).execute()
          title = metadata.get("properties", {}).get("title", "")
          print(f"BUSINESS_SHEET_ID={spreadsheet_id}")
          print(f"BUSINESS_SHEET_TITLE={title}")
          PY
          REMOTE

  migrate-business-schema:
    if: inputs.mode == 'migrate_business_schema'
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
    env:
      TEST_VPS_HOST: ${{ secrets.TEST_VPS_HOST }}
      TEST_VPS_PORT: ${{ secrets.TEST_VPS_PORT }}
      TEST_VPS_USER: ${{ secrets.TEST_VPS_USER }}
      TEST_VPS_SSH_KEY: ${{ secrets.TEST_VPS_SSH_KEY }}
      TEST_VPS_APP_DIR: ${{ secrets.TEST_VPS_APP_DIR }}
    steps:
      - name: Configure SSH
        run: |
          test "$TEST_VPS_APP_DIR" = "/opt/telegram_goals_bot_test"
          install -m 700 -d ~/.ssh
          printf '%s' "$TEST_VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${TEST_VPS_PORT:-22}" "$TEST_VPS_HOST" >> ~/.ssh/known_hosts
      - name: Add required registration columns
        run: |
          ssh -i ~/.ssh/deploy_key -p "${TEST_VPS_PORT:-22}" "$TEST_VPS_USER@$TEST_VPS_HOST" \
            "TEST_APP_DIR='$TEST_VPS_APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          set -a
          . "$TEST_APP_DIR/shared/.env"
          set +a
          cd "$TEST_APP_DIR/current"
          "$TEST_APP_DIR/current/.venv/bin/python" - <<'PY'
          import os
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build

          required = {
              "Participants": (
                  "bot_started_at",
                  "consent_status",
                  "flow_id",
                  "last_stage_updated_at",
                  "onboarding_completed_at",
                  "participant_stage",
              ),
              "Teams": ("flow_id",),
          }
          spreadsheet_id = os.environ["GOOGLE_SHEETS_ID"]
          credentials = Credentials.from_service_account_file(
              os.environ["GOOGLE_APPLICATION_CREDENTIALS"],
              scopes=("https://www.googleapis.com/auth/spreadsheets",),
          )
          sheets = build("sheets", "v4", credentials=credentials, cache_discovery=False)
          metadata = sheets.spreadsheets().get(
              spreadsheetId=spreadsheet_id,
              fields="sheets.properties(sheetId,title,gridProperties.columnCount)",
          ).execute()
          properties = {
              item["properties"]["title"]: item["properties"]
              for item in metadata.get("sheets", [])
          }
          missing_sheets = [name for name in required if name not in properties]
          if missing_sheets:
              raise SystemExit(f"Missing required sheets: {missing_sheets}")

          plans = []
          for sheet_name, required_headers in required.items():
              response = sheets.spreadsheets().values().get(
                  spreadsheetId=spreadsheet_id,
                  range=f"'{sheet_name}'",
                  valueRenderOption="FORMULA",
              ).execute()
              rows = response.get("values") or [[]]
              headers = list(rows[0])
              missing = [header for header in required_headers if header not in headers]
              if not missing:
                  print(f"SCHEMA_OK sheet={sheet_name} added=0")
                  continue
              used_width = max((len(row) for row in rows), default=0)
              start = max(len(headers), used_width)
              end = start + len(missing)
              plans.append((sheet_name, missing, start, end))

          requests = []
          for sheet_name, missing, start, end in plans:
              column_count = properties[sheet_name]["gridProperties"]["columnCount"]
              if end > column_count:
                  requests.append({
                      "appendDimension": {
                          "sheetId": properties[sheet_name]["sheetId"],
                          "dimension": "COLUMNS",
                          "length": end - column_count,
                      }
                  })
              requests.append({
                  "updateCells": {
                      "range": {
                          "sheetId": properties[sheet_name]["sheetId"],
                          "startRowIndex": 0,
                          "endRowIndex": 1,
                          "startColumnIndex": start,
                          "endColumnIndex": end,
                      },
                      "rows": [{
                          "values": [
                              {"userEnteredValue": {"stringValue": header}}
                              for header in missing
                          ]
                      }],
                      "fields": "userEnteredValue",
                  }
              })
              if start > 0:
                  requests.append({
                      "copyPaste": {
                          "source": {
                              "sheetId": properties[sheet_name]["sheetId"],
                              "startRowIndex": 0,
                              "endRowIndex": 1,
                              "startColumnIndex": start - 1,
                              "endColumnIndex": start,
                          },
                          "destination": {
                              "sheetId": properties[sheet_name]["sheetId"],
                              "startRowIndex": 0,
                              "endRowIndex": 1,
                              "startColumnIndex": start,
                              "endColumnIndex": end,
                          },
                          "pasteType": "PASTE_FORMAT",
                          "pasteOrientation": "NORMAL",
                      }
                  })

          if requests:
              sheets.spreadsheets().batchUpdate(
                  spreadsheetId=spreadsheet_id,
                  body={"requests": requests},
              ).execute()

          for sheet_name, missing, _start, _end in plans:
              verified = sheets.spreadsheets().values().get(
                  spreadsheetId=spreadsheet_id,
                  range=f"'{sheet_name}'!1:1",
              ).execute().get("values", [[]])[0]
              absent = [header for header in required[sheet_name] if header not in verified]
              if absent:
                  raise SystemExit(f"Schema verification failed for {sheet_name}: {absent}")
              print(f"SCHEMA_OK sheet={sheet_name} added={len(missing)}")
          PY
          REMOTE

  create-smoke-flow-sheet:
    if: inputs.mode == 'create_smoke_flow_sheet'
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
    env:
      TEST_VPS_HOST: ${{ secrets.TEST_VPS_HOST }}
      TEST_VPS_PORT: ${{ secrets.TEST_VPS_PORT }}
      TEST_VPS_USER: ${{ secrets.TEST_VPS_USER }}
      TEST_VPS_SSH_KEY: ${{ secrets.TEST_VPS_SSH_KEY }}
      TEST_VPS_APP_DIR: ${{ secrets.TEST_VPS_APP_DIR }}
      SHARE_EMAIL: ${{ secrets.TEST_FLOW_OWNER_EMAIL }}
    steps:
      - name: Configure SSH
        run: |
          test "$TEST_VPS_APP_DIR" = "/opt/telegram_goals_bot_test"
          test -n "$SHARE_EMAIL"
          install -m 700 -d ~/.ssh
          printf '%s' "$TEST_VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${TEST_VPS_PORT:-22}" "$TEST_VPS_HOST" >> ~/.ssh/known_hosts
      - name: Copy flow spreadsheet and share with test owner
        run: |
          [[ "$SHARE_EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]]
          share_email_b64=$(printf '%s' "$SHARE_EMAIL" | base64 -w0)
          [[ "$share_email_b64" =~ ^[A-Za-z0-9+/=]+$ ]]
          ssh -i ~/.ssh/deploy_key -p "${TEST_VPS_PORT:-22}" "$TEST_VPS_USER@$TEST_VPS_HOST" \
            "TEST_APP_DIR='$TEST_VPS_APP_DIR' SHARE_EMAIL_B64='$share_email_b64' bash -s" <<'REMOTE'
          set -euo pipefail
          export SHARE_EMAIL="$(printf '%s' "$SHARE_EMAIL_B64" | base64 -d)"
          set -a
          . "$TEST_APP_DIR/shared/.env"
          set +a
          cd "$TEST_APP_DIR/current"
          target_id=$("$TEST_APP_DIR/current/.venv/bin/python" - <<'PY'
          import os
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build

          flow_id = "FLOW_SMOKE_2026_09_01"
          target_name = "Технический тест регистрации — поток 01.09.2026"
          source_id = os.environ["GOOGLE_SHEETS_ID"]
          credentials = Credentials.from_service_account_file(
              os.environ["GOOGLE_APPLICATION_CREDENTIALS"],
              scopes=(
                  "https://www.googleapis.com/auth/drive",
                  "https://www.googleapis.com/auth/spreadsheets.readonly",
              ),
          )
          drive = build("drive", "v3", credentials=credentials, cache_discovery=False)
          sheets = build("sheets", "v4", credentials=credentials, cache_discovery=False)
          query = (
              "appProperties has { key='telegram_goals_flow_id' "
              f"and value='{flow_id}' }} and trashed=false"
          )
          matches = drive.files().list(
              q=query,
              spaces="drive",
              fields="files(id,name)",
              pageSize=10,
          ).execute().get("files", [])
          if len(matches) > 1:
              raise SystemExit("Multiple smoke flow spreadsheets found")
          if matches:
              target_id = matches[0]["id"]
          else:
              source = drive.files().get(
                  fileId=source_id,
                  supportsAllDrives=True,
                  fields="id,parents,driveId",
              ).execute()
              if not source.get("driveId") or not source.get("parents"):
                  raise SystemExit("Source spreadsheet is not stored in a Shared Drive")
              copied = drive.files().copy(
                  fileId=source_id,
                  supportsAllDrives=True,
                  body={
                      "name": target_name,
                      "parents": source["parents"],
                      "appProperties": {"telegram_goals_flow_id": flow_id},
                  },
                  fields="id",
              ).execute()
              target_id = copied["id"]

          share_email = os.environ["SHARE_EMAIL"].strip().lower()
          permissions = drive.permissions().list(
              fileId=target_id,
              supportsAllDrives=True,
              fields="permissions(id,type,role,emailAddress,permissionDetails(inherited))",
          ).execute().get("permissions", [])
          user_permissions = [
              item for item in permissions
              if item.get("type") == "user"
              and item.get("emailAddress", "").strip().lower() == share_email
          ]
          has_writer_access = any(
              item.get("role") in {"writer", "owner"}
              for item in user_permissions
          )
          direct_permission = next(
              (
                  item for item in user_permissions
                  if not any(
                      detail.get("inherited")
                      for detail in item.get("permissionDetails", [])
                  )
              ),
              None,
          )
          if has_writer_access:
              pass
          elif direct_permission is None:
              drive.permissions().create(
                  fileId=target_id,
                  supportsAllDrives=True,
                  sendNotificationEmail=False,
                  body={"type": "user", "role": "writer", "emailAddress": share_email},
                  fields="id",
              ).execute()
          else:
              drive.permissions().update(
                  fileId=target_id,
                  permissionId=direct_permission["id"],
                  supportsAllDrives=True,
                  body={"role": "writer"},
              ).execute()

          verified_permissions = drive.permissions().list(
              fileId=target_id,
              supportsAllDrives=True,
              fields="permissions(type,role,emailAddress)",
          ).execute().get("permissions", [])
          if not any(
              item.get("type") == "user"
              and item.get("emailAddress", "").strip().lower() == share_email
              and item.get("role") in {"writer", "owner"}
              for item in verified_permissions
          ):
              raise SystemExit("Smoke flow owner permission verification failed")

          def titles(spreadsheet_id):
              result = sheets.spreadsheets().get(
                  spreadsheetId=spreadsheet_id,
                  fields="sheets.properties.title",
              ).execute()
              return [item["properties"]["title"] for item in result.get("sheets", [])]

          source_titles = titles(source_id)
          target_titles = titles(target_id)
          if source_titles != target_titles:
              raise SystemExit("Copied spreadsheet tabs do not match source")

          print(target_id)
          PY
          )
          test -n "$target_id"
          echo "FLOW_SHEET_CREATED id=$target_id title=Технический тест регистрации — поток 01.09.2026"
          REMOTE

  configure-flow-registry:
    if: inputs.mode == 'configure_flow_registry'
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
    env:
      TEST_VPS_HOST: ${{ secrets.TEST_VPS_HOST }}
      TEST_VPS_PORT: ${{ secrets.TEST_VPS_PORT }}
      TEST_VPS_USER: ${{ secrets.TEST_VPS_USER }}
      TEST_VPS_SSH_KEY: ${{ secrets.TEST_VPS_SSH_KEY }}
      TEST_VPS_APP_DIR: ${{ secrets.TEST_VPS_APP_DIR }}
      REGISTRY_ID: ${{ inputs.registry_id }}
    steps:
      - name: Configure SSH
        run: |
          test "$TEST_VPS_APP_DIR" = "/opt/telegram_goals_bot_test"
          test -n "$REGISTRY_ID"
          install -m 700 -d ~/.ssh
          printf '%s' "$TEST_VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${TEST_VPS_PORT:-22}" "$TEST_VPS_HOST" >> ~/.ssh/known_hosts
      - name: Configure flow registry and report service identity
        run: |
          ssh -i ~/.ssh/deploy_key -p "${TEST_VPS_PORT:-22}" "$TEST_VPS_USER@$TEST_VPS_HOST" \
            "TEST_APP_DIR='$TEST_VPS_APP_DIR' REGISTRY_ID='$REGISTRY_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          set -a
          . "$TEST_APP_DIR/shared/.env"
          set +a
          "$TEST_APP_DIR/current/.venv/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          env_path = Path(os.environ["TEST_APP_DIR"]) / "shared" / ".env"
          key = "CHALLENGE_FLOWS_SHEETS_ID"
          lines = env_path.read_text(encoding="utf-8").splitlines()
          replacement = f"{key}={os.environ['REGISTRY_ID']}"
          updated = [replacement if line.startswith(f"{key}=") else line for line in lines]
          if not any(line.startswith(f"{key}=") for line in lines):
              updated.append(replacement)
          env_path.write_text("\n".join(updated) + "\n", encoding="utf-8")
          credential_path = Path(os.environ["GOOGLE_APPLICATION_CREDENTIALS"])
          client_email = json.loads(credential_path.read_text(encoding="utf-8"))["client_email"]
          print(f"SERVICE_ACCOUNT_EMAIL={client_email}")
          PY
          REMOTE
