[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-goals-bot"
version = "0.1.0"
description = "Telegram goals tracking MVP foundation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
telegram-goals-bot = "app.runtime:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["app*"]
