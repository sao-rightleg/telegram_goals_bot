# Interview Plan for Feature Planning
#
# Tracks progress of adaptive discovery interview for a new feature/bug/refactoring.
# Updated after EACH user response with scoring, values, and remaining gaps.
#
# Scoring: 0-100% (how well we understand this aspect)
# Status: pending → partial → complete
# Required: true = must reach threshold, false = cover if relevant

# ============================================================================
# Interview Metadata (Session Recovery)
# ============================================================================
interview_metadata:
  started: "2026-07-03 00:00:00"  # Timestamp (YYYY-MM-DD HH:MM:SS)
  last_updated: "2026-07-03 00:00:00"
  status: "completed"  # not_started | in_progress | completed
  can_resume: true
  current_question_num: 1
  feature_size: "M"  # S | M | L

# ============================================================================
# Conversation History (for session recovery)
# ============================================================================
# Preserves complete Q&A. Update after EVERY user response.
#
conversation_history:
  - question_num: 1
    timestamp: "2026-07-03 00:00:00"
    topic: "feature_selection"
    agent_question: |
      After completing voice-processing, the next dependency-safe MVP block is Captain Flows: captain menu, own-team view, manual reports for own-team participants, deadline protection, and role-safe access boundaries. Proceed with a user-spec draft from approved project docs?
    user_answer: |
      Поехали
    summary: "User asked to continue; feature scope inferred from approved MVP docs and product decisions."
