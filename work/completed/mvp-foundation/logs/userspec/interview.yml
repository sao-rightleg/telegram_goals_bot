# Interview Plan for Feature Planning
#
# Tracks progress of adaptive discovery interview for a new feature/bug/refactoring.
# Updated after EACH user response with scoring, values, and remaining gaps.
#
# Scoring: 0-100% (how well we understand this aspect)
# Status: pending → partial → complete
# Required: true = must reach threshold, false = cover if relevant

# ============================================================================
# Interview Metadata (Session Recovery)
# ============================================================================
interview_metadata:
  started: "2026-07-01 22:45:00"  # Timestamp (YYYY-MM-DD HH:MM:SS)
  last_updated: "2026-07-01 22:45:00"
  status: "completed"  # not_started | in_progress | completed
  can_resume: true
  current_question_num: 1
  feature_size: "L"  # S | M | L

# ============================================================================
# Conversation History (for session recovery)
# ============================================================================
# Preserves complete Q&A. Update after EVERY user response.
#
conversation_history:
  - question_num: 1
    timestamp: "2026-07-01 22:45:00"
    topic: "baseline_approval"
    agent_question: |
      Считаем текущую документацию утверждённой базой MVP, чтобы я начал оформлять первую feature `mvp-foundation` по методологии?
    user_answer: |
      Да, считаем
    summary: "User approved current project documentation as MVP baseline; mvp-foundation user-spec can be created from approved docs without repeating the full interview."
# Format:
# - question_num: 1
#   timestamp: "2025-11-12 15:20:33"
#   topic: "user_problem"
#   agent_question: |
#     [Full question text]
#   user_answer: |
#     [Full answer text]
#   summary: "Brief summary"

