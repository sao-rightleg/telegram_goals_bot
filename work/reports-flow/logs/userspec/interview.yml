# Interview Plan for Feature Planning
#
# Tracks progress of adaptive discovery interview for a new feature/bug/refactoring.
# Updated after EACH user response with scoring, values, and remaining gaps.
#
# Scoring: 0-100% (how well we understand this aspect)
# Status: pending → partial → complete
# Required: true = must reach threshold, false = cover if relevant

# ============================================================================
# Interview Metadata (Session Recovery)
# ============================================================================
interview_metadata:
  started: "2026-07-08 20:29:10"  # Timestamp (YYYY-MM-DD HH:MM:SS)
  last_updated: "2026-07-08 20:29:10"
  status: "completed"  # not_started | in_progress | completed
  can_resume: true
  current_question_num: 1
  feature_size: "L"  # S | M | L

# ============================================================================
# Conversation History (for session recovery)
# ============================================================================
# Preserves complete Q&A. Update after EVERY user response.
#
conversation_history:
  - question_num: 1
    timestamp: "2026-07-08 20:29:10"
    topic: "feature_start"
    agent_question: |
      Пользователь сказал "идем дальше" после оценки прогресса MVP. По docs/08_mvp_plan.md следующий незакрытый блок — Phase 8 Reports: short Telegram team report, PDF team report, full summary for admin/Sitnikov, group comparison and role-safe delivery.
    user_answer: |
      Идем дальше.
    summary: "Start reports-flow planning from approved MVP plan and report docs."
# Format:
# - question_num: 1
#   timestamp: "2025-11-12 15:20:33"
#   topic: "user_problem"
#   agent_question: |
#     [Full question text]
#   user_answer: |
#     [Full answer text]
#   summary: "Brief summary"

