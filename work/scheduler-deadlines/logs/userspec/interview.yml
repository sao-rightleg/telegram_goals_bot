# Interview Plan for Feature Planning
#
# Tracks progress of adaptive discovery interview for a new feature/bug/refactoring.
# Updated after EACH user response with scoring, values, and remaining gaps.
#
# Scoring: 0-100% (how well we understand this aspect)
# Status: pending → partial → complete
# Required: true = must reach threshold, false = cover if relevant

# ============================================================================
# Interview Metadata (Session Recovery)
# ============================================================================
interview_metadata:
  started: "2026-07-08 15:44:30"  # Timestamp (YYYY-MM-DD HH:MM:SS)
  last_updated: "2026-07-08 16:11:55"
  status: "in_progress"  # not_started | in_progress | completed
  can_resume: true
  current_question_num: 6
  feature_size: "M"  # S | M | L

# ============================================================================
# Conversation History (for session recovery)
# ============================================================================
# Preserves complete Q&A. Update after EVERY user response.
#
conversation_history:
  - question_num: 1
    timestamp: "2026-07-08 15:44:30"
    topic: "feature scope, silent notifications, testing strategy"
    agent_question: |
      1. Подтверждаешь имя фичи `scheduler-deadlines` и такой scope: напоминания + дедлайн + silent participants + week close, без PDF/report generation в этой фиче?

      2. Silent participant после дедлайна: система должна сразу записывать `⬜` weekly report в Google Sheets за каждого активного участника без отчёта, или только помечать/уведомлять, а запись `⬜` делать уже в report generation?

      3. Кого уведомляем по silent participants: капитана команды и трекера команды по каждому участнику отдельно, или одним агрегированным сообщением со списком молчащих по команде?

      4. Для проверки в разработке достаточно локальных pytest/fake boundaries + ручной smoke через вызов scheduler service, или в этой фиче уже нужен тестовый Telegram bot / test Google Sheets smoke?
    user_answer: |
      1 подтверждаю
      2 не понял вопроса
      3 капитана и треккера одним аггрегированным сообщением о молчащих
      4 не знаю, а ты как думаешь ?
    summary: "Feature name and scope confirmed. Silent participant notifications should be one aggregated message to the captain and tracker. Need clarify when gray no-answer facts are written. Testing strategy requires recommendation."
  - question_num: 2
    timestamp: "2026-07-08 15:48:22"
    topic: "gray persistence, reminder recipients, unfinished drafts, notification copy"
    agent_question: |
      1. Подтверждаешь вариант 1: при week close scheduler пишет `⬜` в Google Sheets за всех активных участников без отчёта?

      2. Напоминания отправляем всем активным участникам с consent, у кого ещё нет отчёта за неделю. Выбывшим не отправляем. Верно?

      3. Если участник начал черновик отчёта до дедлайна, но не нажал `✅ Готово` до 23:59: считаем его silent и ставим `⬜`, а черновик оставляем как технический draft/историю или очищаем?

      4. Текст агрегированного сообщения капитану/трекеру предлагаю такой:
      `Нет отчёта за неделю {week_number}: {N} участник(ов).`
      Дальше список:
      `- {name}`
      Нормально, или нужно сразу добавлять телефон/username/прогресс?
    user_answer: |
      1 согласен
      2 верно
      3 верно, черновик оставляем
      4 согласен
    summary: "Week close should create official gray no-answer rows in Google Sheets for active participants without finalized weekly reports. Reminders target active consenting participants without reports and exclude dropped participants. Unfinished drafts remain as technical draft/history after deadline. Silent notifications use short aggregated message with participant names."
  - question_num: 3
    timestamp: "2026-07-08 15:58:38"
    topic: "Sunday 18:00 reminder behavior and per-participant retry"
    agent_question: |
      1. В воскресенье 18:00 сообщение должно просто запускать обычный weekly report flow с кнопками `🟩/🟦/🟥`, или это только текстовое напоминание без кнопок?

      2. Если scheduler не смог отправить напоминание одному участнику, но остальным отправил: продолжаем job, пишем failed в `reminder_log`, отправляем admin error, но не валим всю задачу. Согласен?

      3. Если при week close Google Sheets write упал на середине: при повторном запуске scheduler должен дописать только недостающие `⬜` и не создавать дубликаты. Согласен?

      4. После week close нужно ли отправлять участнику сообщение “Дедлайн прошёл, неделя отмечена как ⬜”, или участнику ничего не отправляем, а уведомляем только капитана/трекера? Моя рекомендация: участнику не отправлять, чтобы не плодить лишние сообщения; он уже получил 22:30 и 23:00.
    user_answer: |
      1 у нас дедлайн в восрксенье до скольки указан ?

      [Agent answered: дедлайн воскресенье 23:59 по Екатеринбургу; 18:00 финальный чек-ин, 22:30 напоминание, 23:00 последнее напоминание, 23:59 жёсткий дедлайн.]

      1 значит в воскресенье в 18-00 только напоминание что дедлайн вот-вот
      2 верно, но стараемся отправить заново именно этому участнику
      3 вопрос оборван
      4 да
    summary: "Sunday 18:00 is only a deadline-is-soon reminder, not report-flow launch. Failed reminder delivery for one participant must not fail the whole job; system should keep retry specifically for that participant. User agreed with not sending a separate participant message after week close; only captain/tracker are notified. Week close partial-write behavior needs to be re-asked."
  - question_num: 4
    timestamp: "2026-07-08 16:02:14"
    topic: "idempotent week close after partial Google Sheets failure"
    agent_question: |
      Если в воскресенье 23:59 scheduler закрывает неделю и создаёт `⬜` в Google Sheets, может случиться частичный сбой: например, из 40 молчащих участников он успел записать `⬜` для 25, а потом Google Sheets API упал.

      Моё предложение: повторный запуск week close должен быть идемпотентным:
      - проверить, у кого `weekly_report` за эту неделю уже есть;
      - не трогать эти записи;
      - дописать `⬜` только тем активным участникам, у кого отчёта всё ещё нет;
      - не создавать дубликаты;
      - отправить admin error о сбое.

      Подтверждаешь?

      И ещё один уточняющий вопрос по retry напоминаний: сколько раз пробуем переотправить одному участнику после сбоя? Моя рекомендация для MVP: 3 попытки с сохранением failed/skipped в SQLite, без бесконечных retry.
    user_answer: |
      что значит идемпотентным

      [Agent explained: repeated week close must not duplicate existing reports; it only fills missing gray reports after partial failures.]

      согласен
    summary: "User agreed that week close must be idempotent after explanation: repeated runs should skip existing weekly reports, create only missing gray no-answer rows, avoid duplicates, and notify admin about failures. Reminder retry limit remains unanswered."
  - question_num: 5
    timestamp: "2026-07-08 16:08:30"
    topic: "reminder retry policy"
    agent_question: |
      Для одного участника, которому не удалось отправить напоминание, делаем до **3 попыток**. Если после 3 попыток не отправилось:
      - пишем failed/skipped в SQLite;
      - отправляем admin error;
      - не блокируем отправку другим участникам;
      - следующая плановая рассылка всё равно снова попробует отправить, если участник всё ещё без отчёта.

      Подходит?
    user_answer: |
      да
    summary: "Reminder retry policy confirmed: up to 3 attempts per failed participant per reminder job; after exhaustion record failed/skipped in SQLite and notify admin, without blocking other participants. Later planned reminders can try again if the participant still has no report."
  - question_num: 6
    timestamp: "2026-07-08 16:11:55"
    topic: "consent, missing notification recipients, silent details, late draft behavior"
    agent_question: |
      1. Если у участника `consent_given = false`, напоминания ему не отправляем. Но если он активный и не сдал отчёт, при week close ставим ему `⬜` или пропускаем? Моя рекомендация: ставим `⬜`, потому что он активный участник недели, но бот не может писать ему до согласия.

      2. Если у команды нет капитана или у трекера нет Telegram chat id, week close всё равно создаёт `⬜`, но silent notification для этого получателя пропускается, а admin получает error. Согласен?

      3. Нужно ли в silent notification капитану/трекеру включать только имена молчащих, или ещё статус черновика: например `Иван Иванов — начал черновик, не завершил`? Моя рекомендация: только имена в MVP, черновики не раскрывать в уведомлении.

      4. После 23:59 участник с незавершённым черновиком при попытке нажать `✅ Готово` получит уже существующее сообщение `Дедлайн недели уже прошёл. Отчёт не может изменить статус.` Черновик остаётся. Подходит?
    user_answer: |
      1 2 3 4 - подходит
    summary: "Confirmed: non-consenting active participants do not receive reminders but receive official gray no-answer rows at week close if no finalized report exists. Missing captain/tracker chat id does not block week close; notification for that recipient is skipped and admin receives error. Silent notification lists only participant names, not draft state. Late draft finalization returns the existing deadline message and keeps the draft."
